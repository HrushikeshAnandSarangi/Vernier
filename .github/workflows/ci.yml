name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install LLVM, Clang, and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-18 llvm-18-dev llvm-18-tools clang-18 ninja-build cmake
          echo "/usr/lib/llvm-18/bin" >> $GITHUB_PATH

      - name: Configure CMake
        run: |
          cmake -G Ninja -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_DIR=/usr/lib/llvm-18/cmake

      - name: Build Vernier plugin, CLI tool, and tests
        run: |
          cmake --build build

      - name: Run CTest Suite
        run: |
          ctest --test-dir build --output-on-failure
